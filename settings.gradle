pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // libadb-android (ADB client + wireless-debugging pairing)
        // and its spake2 dependency are distributed via JitPack.
        maven {
            url = uri("https://jitpack.io")
            content {
                includeGroup("com.github.MuntashirAkon")
                includeGroup("com.github.MuntashirAkon.spake2-java")
            }
        }
    }
}

rootProject.name = "PhoneSecurityAssistant"
include(":app")
include(":LiveDataEvent")
include(":PrefsLib")
