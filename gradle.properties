# Project-wide Gradle settings.

# 2026-07-25: disabled in favour of leaving it to the machine environment
# 2026-10-18: restored - the default 512 MiB heap makes ':app:minifyReleaseWithR8'
# fail with "java.lang.OutOfMemoryError: Java heap space" once the app grew
# (BouncyCastle + libadb + OkHttp + Kotlin stdlib).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# 2026-07-25: disabled
# org.gradle.configureondemand=true

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.vfs.watch=true

# https://developer.android.com/build/releases/agp-9-0-0-release-notes
android.r8.strictFullModeForKeepRules=false
#android.r8.optimizedResourceShrinking=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
